# Render Blueprint: https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: market-watch
    runtime: node
    plan: free
    # One instance only: each instance simulates its own prices.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
